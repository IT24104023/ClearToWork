name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Flutter Android Release APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.3'
        channel: 'stable'
        cache: true

    - name: Configure Android Project & Dependencies
      working-directory: mobile
      run: |
        flutter config --enable-android
        if [ ! -d "android" ]; then
          flutter create --platforms=android --org com.cleartowork.app .
        fi
        flutter pub get

    - name: Build Android Release APK
      working-directory: mobile
      run: flutter build apk --release

    - name: Upload Release APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: cleartowork-safety-app-release
        path: mobile/build/app/outputs/flutter-apk/app-release.apk

    - name: Publish Direct Download Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0-apk
        name: "ClearToWork AI Mobile APK v1.0.0"
        body: |
          ### ClearToWork AI — Android Release APK
          Production Android release APK built for SE3090 Assignment 1 evaluation.
          - Shared ASP.NET Core REST API Integration
          - 5-Agent LangGraph AI Clearance Telemetry
          - Digital Worker Badge & LOTO QR Scanner
          - Device GPS Geofence Verification
          - Real-Time Atmospheric Gas Monitor Logger
        files: mobile/build/app/outputs/flutter-apk/app-release.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
