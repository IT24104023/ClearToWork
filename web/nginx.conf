server {
    listen 80;
    listen 10000;
    server_name _;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass https://cleartowork-backend.onrender.com/api/;
        proxy_ssl_server_name on;
        proxy_set_header Host cleartowork-backend.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /agent-api/ {
        proxy_pass https://cleartowork-agent.onrender.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host cleartowork-agent.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
