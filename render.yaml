services:
  # 1. Agent Service (Python LangGraph)
  - type: web
    name: cleartowork-agent
    runtime: docker
    dockerfilePath: agents/Dockerfile
    dockerContext: agents
    plan: free
    region: oregon
    envVars:
      - key: SHARED_SECRET
        value: ClearToWork_Internal_Agent_Key_2026

  # 2. ASP.NET Core Backend API
  - type: web
    name: cleartowork-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    envVars:
      - key: ConnectionStrings__DefaultConnection
        value: Data Source=cleartowork_local.db
      - key: Jwt__Key
        value: ClearToWork_Super_Secret_Key_For_Development_Must_Be_32_Chars_Long!
      - key: Jwt__Issuer
        value: ClearToWorkAPI
      - key: Jwt__Audience
        value: ClearToWorkClients
      - key: AgentService__BaseUrl
        fromService:
          type: web
          name: cleartowork-agent
          property: host
      - key: AgentService__SharedSecret
        fromService:
          type: web
          name: cleartowork-agent
          envVarKey: SHARED_SECRET

  # 3. React Frontend Client (Static Site with SPA rewrites)
  - type: static
    name: cleartowork-frontend
    buildCommand: cd web && npm install && npm run build
    publishPath: web/dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://cleartowork-backend.onrender.com/api/*
      - type: rewrite
        source: /agent-api/*
        destination: https://cleartowork-agent.onrender.com/*
      - type: rewrite
        source: /*
        destination: /index.html
